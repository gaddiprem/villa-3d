<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Private</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1f2;color:#1d2a31;font:16px/1.4 system-ui,sans-serif}
form{width:min(320px,calc(100vw - 32px));display:grid;gap:10px}
input,button{font:inherit;padding:12px;border-radius:6px;border:1px solid #9aa7ae}
button{background:#1f6f78;color:#fff;border:0}
button:disabled{opacity:.6}
#msg{min-height:1.4em;font-size:14px}
</style></head><body>
<form id="f" hidden><label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" required autofocus>
<button id="go">Open</button></form><div id="msg" role="status"></div>
<script type="module">
// Decrypts the manifest, then fetches and decrypts only the files not already in Cache Storage (sw.js serves them under v/).
// The key is kept in IndexedDB on this device, so later updates load without asking for the password again.
const MAN='m-cf702a428a6d.bin', msg=document.getElementById('msg'), form=document.getElementById('f'), go=document.getElementById('go');
const view=()=>location.replace('v/villa_3d.html'), mark=new URL('v/.manifest',location).href;
const idb=(mode,fn)=>new Promise((ok,no)=>{const r=indexedDB.open('villa',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');
  r.onerror=()=>no(r.error);r.onsuccess=()=>{const q=fn(r.result.transaction('k',mode).objectStore('k'));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}});
let cache;
async function open(key,man){
  const list=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:man.slice(16,28)},key,man.slice(28))));
  const need=[]; for(const e of list){const r=await cache.match(new URL('v/'+e[0],location).href);if(r?.headers.get('X-Id')!==e[2])need.push(e)}
  let done=0;
  const one=async([p,type,id,gz])=>{
    const b=await(await fetch('f/'+id+'.bin')).arrayBuffer();
    let data=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
    if(gz)data=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    await cache.put(new URL('v/'+p,location).href,new Response(data,{headers:{'Content-Type':type,'X-Id':id}}));
    msg.textContent=`Downloading ${++done} of ${need.length} files`;
  };
  const q=[...need]; await Promise.all(Array.from({length:6},async()=>{while(q.length)await one(q.shift())}));
  await cache.put(mark,new Response(MAN)); await navigator.serviceWorker.ready; view();
}
if(!('serviceWorker' in navigator)||!self.caches)msg.textContent='This browser cannot open it. Open the link in Chrome or Safari.';
else{
  navigator.serviceWorker.register('sw.js');
  for(const k of await caches.keys())if(k!=='villa')await caches.delete(k);
  cache=await caches.open('villa');
  const m=await cache.match(mark), key=await idb('readonly',s=>s.get('aes')).catch(()=>null);
  if(m&&await m.text()===MAN){await navigator.serviceWorker.ready;view()}
  else if(key){msg.textContent='Updating…';try{await open(key,await(await fetch(MAN)).arrayBuffer())}catch{msg.textContent='';form.hidden=false}}
  else form.hidden=false;
}
form.onsubmit=async e=>{
  e.preventDefault(); go.disabled=true; msg.textContent='Unlocking…';
  try{
    const man=await(await fetch(MAN)).arrayBuffer();
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:man.slice(0,16),iterations:600000,hash:'SHA-256'},base,512);
    const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-GCM',false,['decrypt']);
    try{await crypto.subtle.decrypt({name:'AES-GCM',iv:man.slice(16,28)},key,man.slice(28))}
    catch{msg.textContent='Wrong password.';go.disabled=false;return}
    await idb('readwrite',s=>s.put(key,'aes')).catch(()=>{});
    await open(key,man);
  }catch(err){msg.textContent='Could not open: '+err.message;go.disabled=false}
};
</script></body></html>
